<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Linka 検証2</title>
    <style>
      body { font: 13px system-ui, sans-serif; margin: 14px; color: #1c2638; }
      h1 { font-size: 15px; margin: 0 0 4px; }
      h2 { font-size: 13px; margin: 18px 0 6px; }
      p { margin: 0 0 6px; }
      .muted { color: #566079; }
      ul { margin: 0; padding-left: 18px; }
      li { margin-bottom: 8px; }
      .ok { color: #157a6e; font-weight: 600; }
      .ng { color: #b02e66; font-weight: 600; }
      button { font: inherit; padding: 5px 10px; border-radius: 6px; border: 1px solid #c9cee0; background: #fff; cursor: pointer; margin: 0 6px 6px 0; }
      pre { white-space: pre-wrap; font-size: 11px; background: #f1f3f7; padding: 8px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <h1>検証2：ツールバーから記憶</h1>
    <p class="muted">このパネルは DB を持たず、隠しページ（offscreen document）に問い合わせます。</p>

    <h2>記憶したページ</h2>
    <ul id="pages"></ul>

    <h2>Gemini Nano がどこで使えるか</h2>
    <button id="ai-offscreen">隠しページで試す</button>
    <button id="ai-here">このパネルで試す</button>
    <div id="ai"></div>

    <h2>その他</h2>
    <button id="reset">記憶したページを消す</button>
    <pre id="out" hidden></pre>
    <script type="module" src="/src/sidepanel.ts"></script>
  </body>
</html>
