name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, unit test, build
    # 公開リポジトリで self-hosted runner を使うと、外部の PR が自分の環境でコードを動かせるので GitHub-hosted にする
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm
      - run: npm install -g npm@12.2.2
      - run: npm ci
      - name: Lint and format
        run: npx biome ci .
      - name: Typecheck
        run: npm run typecheck
      - name: Unit test
        run: npm test
      - name: Build
        run: npm run build
      - name: Seed is up to date
        run: npm run seed && git diff --exit-code seed/
