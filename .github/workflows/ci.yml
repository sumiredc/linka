name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, unit test, build
    # aidd-infra の ARC runner scale set（カスタムラベルは付けられないので scale set 名で指定する）。
    # 公開前に GitHub-hosted runner へ移す（#4）
    runs-on: arc-runner-linka
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm
      - run: npm install -g npm@12.2.2
      - run: npm ci
      - name: Lint and format
        run: npx biome ci .
      - name: Typecheck
        run: npm run typecheck
      - name: Unit test
        run: npm test
      - name: Build
        run: npm run build
